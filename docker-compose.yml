services:
  strm-scraper:
    build: .
    image: strm-scraper:latest
    container_name: strm-scraper
    restart: unless-stopped
    ports:
      - "6666:6666"
    volumes:
      - ./config:/config                    # 配置目录，必须（配置、账号、状态库、日志都在这）
      - /vol1/1000/LitePan/strm:/media      # 媒体库，可映射多个
      # - /vol1/1000/另一个媒体库:/media2   # 再挂一个库，同时把 /media2 加进 scan.roots
    environment:
      TZ: Asia/Shanghai
      # 这些不写就用 /config/config.yaml 里的值
      # WS_SCAN__CONCURRENCY: "4"
      # WS_SCAN__INTERVAL_MINUTES: "360"
      # WS_LOG__LEVEL: "DEBUG"
      # 想免登录（内网或反代有鉴权时）就取消下面这行
      # WS_WEB__AUTH__ENABLED: "false"
      # 媒体服务器建议写在 config.yaml 的 servers 段（列表用环境变量不好表达）
    # 如果海报写不进媒体目录，通常是权限问题，可以用下面这行以 root 运行
    # user: "0:0"
