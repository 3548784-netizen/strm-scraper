# 直接拉取现成镜像部署，不需要在 NAS 上构建
# 飞牛「Docker → 项目 → 新建」，把下面内容整段粘进去即可
# 两个镜像仓库内容一致，哪个拉得快用哪个：
#   Docker Hub  3548784/strm-scraper:latest
#   GHCR        ghcr.io/3548784-netizen/strm-scraper:latest
# 注意：真正使用前把 /vol1/1000/LitePan/strm 改成你自己的 strm 目录
services:
  strm-scraper:
    image: 3548784/strm-scraper:latest
    container_name: strm-scraper
    restart: unless-stopped
    ports:
      - "6666:6666"
    volumes:
      - ./config:/config                    # 配置目录，必须（配置、账号、状态库、日志都在这）
      - /vol1/1000/LitePan/strm:/media      # 媒体库，可映射多个
      # - /vol1/1000/另一个媒体库:/media2   # 再挂一个库，同时把 /media2 加进 scan.roots
    environment:
      TZ: Asia/Shanghai
      # 想免登录（内网或反代有鉴权时）就取消下面这行
      # WS_WEB__AUTH__ENABLED: "false"
