# 直接拉取现成镜像部署，不需要在 NAS 上构建
# 飞牛「Docker → 项目 → 新建」，把下面内容整段粘进去即可
# 注意：真正使用前把 /vol1/1000/LitePan/strm 改成你自己的 strm 目录
services:
  strm-scraper:
    image: ghcr.io/3548784-netizen/strm-scraper:latest
    container_name: strm-scraper
    restart: unless-stopped
    ports:
      - "6666:6666"
    volumes:
      - /vol1/1000/LitePan/strm:/media
      - ./config:/config
    environment:
      TZ: Asia/Shanghai
