<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a71ff'/%3E%3Crect x='7' y='9' width='18' height='14' rx='2.5' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='12' cy='14' r='1.5' fill='white'/%3E%3Cpath d='M7 21l5-5 3.5 3.5L19 16l6 6' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<title>登录 · strm-scraper</title>
<style>
  :root {
    /* 与主界面共用 Amane 设计令牌，只保留登录页用得到的 */
    --bg: #242424;
    --bg-deep: #141414;
    --surface: #1f1f1f;
    --surface-2: #2e2e2e;
    --line-soft: #2b2b2b;
    --line: #424242;
    --line-strong: #696969;
    --text: #ededed;
    --text-2: #c9c9c9;
    --text-3: #828282;
    --text-4: #696969;
    --accent: #1a71ff;
    --accent-hover: #0060e4;
    --accent-solid: #0055cc;
    --accent-solid-hover: #0049b4;
    --accent-soft: rgba(26, 113, 255, .14);
    --err-soft: rgba(250, 82, 82, .14);
    --err-ink: #ffa8a8;
    --warn-soft: rgba(250, 176, 5, .14);
    --warn-ink: #ffe066;
    --jf: #4dabf7;

    --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px;
    --fw-medium: 500; --fw-semibold: 600;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 32px;
    --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 8px;
    --h-ctl: 40px;
    --h-btn-lg: 42px;
    --sh-2: 0 4px 12px rgba(0, 0, 0, .26);
    --sh-3: 0 12px 32px rgba(0, 0, 0, .38);
    --ease: cubic-bezier(.4, 0, .2, 1);
    --dur: .16s;
    --font: "IBM Plex Sans", "Noto Sans SC", "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: var(--fs-sm)/1.55 var(--font);
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; padding: var(--s6);
  }
  .card {
    width: 100%; max-width: 380px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: var(--s6) var(--s6) var(--s5);
    box-shadow: var(--sh-2);
  }
  .brand { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s6); }
  .mark {
    width: 42px; height: 42px; border-radius: var(--r-md); flex: none;
    background: var(--accent-solid);
    display: grid; place-items: center;
    box-shadow: none;
  }
  .mark svg { width: 23px; height: 23px; }
  h1 { margin: 0; font-size: 17px; font-family: var(--font);
       font-weight: var(--fw-semibold); letter-spacing: 0; }
  .sub { color: var(--text-3); font-size: 12px; margin-top: 2px; }

  label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin: 0 0 6px; }
  .field { margin-bottom: var(--s4); }
  input {
    font: inherit; font-size: 14px; width: 100%; height: var(--h-ctl);
    padding: 0 var(--s3); border-radius: var(--r-sm);
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    outline: none;
    transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  input:hover { border-color: var(--line-strong); }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  input::placeholder { color: var(--text-4); }

  /* 登录页是大表单档：输入框 40 / 提交 42，内部一套尺寸；
     语义与主站一致（实心蓝主操作），状态也只有这一套定义。 */
  button {
    font: inherit; font-size: var(--fs-md); font-family: var(--font);
    font-weight: var(--fw-semibold); width: 100%;
    height: var(--h-btn-lg); border-radius: var(--r-sm); cursor: pointer;
    border: 1px solid transparent; color: #fff;
    background: var(--accent-solid);
    box-shadow: none;
    transition: background var(--dur) var(--ease), transform var(--dur) var(--ease),
                box-shadow var(--dur) var(--ease);
    margin-top: var(--s1); letter-spacing: 0;
  }
  button:hover:not(:disabled):not(.is-loading) { background: var(--accent-solid-hover); }
  button:active:not(:disabled):not(.is-loading) { transform: translateY(1px); box-shadow: none; }
  button:disabled, button[aria-disabled="true"] {
    opacity: .38; cursor: not-allowed; box-shadow: none; transform: none;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-xs); }

  .msg {
    display: none; font-size: 12px; line-height: 1.55;
    padding: var(--s2) var(--s3); border-radius: var(--r-sm); margin-bottom: var(--s4);
  }
  .msg.show { display: block; }
  .msg.err { background: var(--err-soft); border: 1px solid rgba(250, 82, 82, .35); color: var(--err-ink); }
  .msg.warn { background: var(--warn-soft); border: 1px solid rgba(250, 176, 5, .35); color: var(--warn-ink); }

  .foot {
    margin-top: var(--s5); padding-top: var(--s4); border-top: 1px solid var(--line-soft);
    color: var(--text-3); font-size: 11.5px; line-height: 1.8;
  }
  .foot code {
    font-family: var(--font-mono); color: var(--text-2);
    background: var(--surface-2); padding: 1px 5px; border-radius: var(--r-xs);
  }
  /* Amane 视觉适配：纯色 / 8px / 无发光；表单结构保持不变 */
  body { background: var(--bg); font: var(--fs-sm)/1.55 var(--font); }
  .card { border-radius: var(--r-md); box-shadow: var(--sh-2); }
  .mark { background: var(--accent-solid); box-shadow: none; }
  h1 { font-family: var(--font); font-weight: var(--fw-semibold); letter-spacing: 0; }
  input:hover { border-color: var(--line-strong); }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  /* 按钮的层级 / 尺寸 / 五态统一定义在上面，这里只留加载圆环 */
  button.is-loading, button[data-loading="1"] { pointer-events: none; }
  button.is-loading::before, button[data-loading="1"]::before {
    content: ''; display: inline-block; vertical-align: -2px; margin-right: 8px;
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid currentColor; border-top-color: transparent;
    animation: amane-spin .7s linear infinite;
  }
  @keyframes amane-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    button.is-loading::before { animation: none; }
  }
</style>
</head>
<body>
<form class="card" id="form" autocomplete="on">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2.5"></rect>
        <path d="M3 14l4.5-4.5L12 14l3-3 6 6"></path>
        <circle cx="8.5" cy="8.5" r="1.2" fill="#fff" stroke="none"></circle>
      </svg>
    </div>
    <div>
      <h1>strm-scraper</h1>
      <div class="sub">登录后管理刮削任务</div>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="field">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username"
           autocapitalize="off" spellcheck="false" required>
  </div>
  <div class="field">
    <label for="password">密码</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>
  </div>

  <button type="submit" id="btn">登 录</button>

  <div class="foot">
    忘记密码：删除 <code>config/auth.json</code>，重启容器后恢复为 <code>admin</code> / <code>admin</code>。
  </div>
</form>

<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let next = params.get('next') || '/';
// 只允许站内跳转，挡掉 //evil.com 这类开放重定向
if (!next.startsWith('/') || next.startsWith('//')) next = '/';

function showMsg(text, kind) {
  const el = $('msg');
  el.textContent = text;
  el.className = 'msg show ' + (kind || 'err');
}

async function boot() {
  try {
    const res = await fetch('/api/auth-info');
    const info = await res.json();
    if (!info.enabled) { location.replace('/'); return; }
    if (info.logged_in) { location.replace(next); return; }
    if (info.default_password) {
      showMsg('还在用默认密码 admin，登录后请立刻修改', 'warn');
    }
    $('username').value = info.default_password ? 'admin' : '';
    ($('username').value ? $('password') : $('username')).focus();
  } catch (e) {
    showMsg('无法连接服务，检查容器是否在运行', 'err');
  }
}

$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = $('btn');
  const username = $('username').value.trim();
  const password = $('password').value;
  if (!username || !password) { showMsg('请输入用户名和密码'); return; }

  btn.disabled = true;
  btn.classList.add('is-loading');
  btn.dataset.loading = '1';
  btn.setAttribute('aria-busy', 'true');
  btn.setAttribute('aria-disabled', 'true');
  btn.textContent = '登录中…';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      showMsg(data.detail || data.message || '登录失败', 'err');
      $('password').select();
      return;
    }
    location.replace(next);
  } catch (e) {
    showMsg('网络异常，请重试', 'err');
  } finally {
    btn.disabled = false;
    btn.classList.remove('is-loading');
    delete btn.dataset.loading;
    btn.removeAttribute('aria-busy');
    btn.removeAttribute('aria-disabled');
    btn.textContent = '登 录';
  }
});

boot();
</script>
</body>
</html>
