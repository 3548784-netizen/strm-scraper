name: 构建镜像

# 推送到 main 或打 v* 标签时自动构建，也可以在 Actions 页面手动触发
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Docker Hub 上的仓库名固定为 strm-scraper
  HUB_REPO: strm-scraper

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备构建器
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub 没配 secrets 时这一步会失败，但不影响 GHCR 照常发布
      - name: 登录 Docker Hub
        id: hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成 GHCR 标签
        id: ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: 生成 Docker Hub 标签
        id: hubmeta
        if: steps.hub.outcome == 'success'
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.HUB_REPO }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: 构建并推送到 GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ghcr.outputs.tags }}
          labels: ${{ steps.ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 第二步复用上面的 gha 缓存，实际只花几秒
      - name: 构建并推送到 Docker Hub
        if: steps.hub.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.hubmeta.outputs.tags }}
          labels: ${{ steps.hubmeta.outputs.labels }}
          cache-from: type=gha

      # 页面说明直接取 docs/dockerhub.md，改文件推上来就同步，不用手动粘贴
      - name: 同步 Docker Hub 页面说明
        if: steps.hub.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          user, token = os.environ["HUB_USER"], os.environ["HUB_TOKEN"]
          body = open("docs/dockerhub.md", encoding="utf-8").read()

          login = urllib.request.Request(
              "https://hub.docker.com/v2/users/login",
              data=json.dumps({"username": user, "password": token}).encode(),
              headers={"Content-Type": "application/json"},
          )
          jwt = json.load(urllib.request.urlopen(login, timeout=30))["token"]

          edit = urllib.request.Request(
              f"https://hub.docker.com/v2/repositories/{user}/strm-scraper/",
              data=json.dumps({
                  "full_description": body,
                  "description": "115 网盘 strm 刮削器 · 海报/NFO · "
                                 "定时自动化 · Emby & Jellyfin 联动",
              }, ensure_ascii=False).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"JWT {jwt}",
              },
              method="PATCH",
          )
          urllib.request.urlopen(edit, timeout=30)
          print("Docker Hub 页面说明已同步")
          PY

  # 打 v* 标签时自动建 Release，说明用上一个标签到这个标签之间的提交记录生成
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 要拿到上一个标签才能列出两次发版之间的提交
          fetch-depth: 0

      - name: 生成发布说明
        run: |
          python3 - <<'PY'
          import os, subprocess

          tag = os.environ["GITHUB_REF_NAME"]
          ver = tag.lstrip("vV")

          def git(*args):
              r = subprocess.run(["git", *args], capture_output=True, text=True)
              return r.stdout.strip() if r.returncode == 0 else ""

          # 上一个标签；首个版本没有上一个，就把全部提交都列出来
          prev = git("describe", "--tags", "--abbrev=0", tag + "^")
          since = prev or "（首个正式版本，包含此前的全部提交）"

          raw = git("log", "--no-merges", "--pretty=%h|%s",
                    (prev + ".." + tag) if prev else tag)
          commits = [line.split("|", 1) for line in raw.splitlines() if "|" in line]

          def group(subject):
              s = subject.lower()
              if s.startswith(("feat",)) or "新增" in s or "支持" in s:
                  return "新功能"
              if s.startswith("fix") or "修复" in s or "修掉" in s:
                  return "修复"
              if s.startswith("perf") or "提速" in s or "性能" in s or "并发" in s:
                  return "性能"
              if s.startswith(("style", "ui")) or "界面" in s or "样式" in s:
                  return "界面"
              if s.startswith(("chore", "docs", "test", "refactor")):
                  return "其他"
              return "更新"

          order = ["新功能", "修复", "性能", "界面", "更新", "其他"]
          buckets = {k: [] for k in order}
          for short, subject in commits:
              buckets[group(subject)].append((short, subject))

          lines = [f"## {tag}", "",
                   f"上一次发版：{since}", "",
                   "### 拉取镜像", "`docker pull 3548784/strm-scraper:%s`" % ver,
                   f"（另有 `{'.'.join(ver.split('.')[:2])}` 跟随小版本、`latest` 跟随主线；"
                   f"GHCR：`ghcr.io/3548784-netizen/strm-scraper:{ver}`）", ""]

          for key in order:
              if buckets[key]:
                  lines.append(f"### {key}")
                  lines += [f"- {s}（`{h}`）" for h, s in buckets[key]]
                  lines.append("")

          if not commits:
              lines.append("本次没有新的提交记录。")
              lines.append("")

          lines += ["<details><summary>完整提交列表</summary>", ""]
          lines += [f"- `{h}` {s}" for h, s in commits]
          lines += ["", "</details>"]

          open("RELEASE_NOTES.md", "w", encoding="utf-8").write("\n".join(lines))
          print("\n".join(lines))
          PY

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
