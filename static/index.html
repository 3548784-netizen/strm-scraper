<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>strm 刮削器</title>
<style>
  :root {
    --bg: #0b0e14;
    --surface: #131722;
    --surface-2: #1a2030;
    --border: #232b3d;
    --border-soft: #1c2333;
    --text: #e6edf3;
    --muted: #8b98ad;
    --dim: #5d6a80;
    --accent: #4c8dff;
    --accent-soft: rgba(76, 141, 255, .12);
    --ok: #3fb950;
    --ok-soft: rgba(63, 185, 80, .12);
    --warn: #d29922;
    --warn-soft: rgba(210, 153, 34, .12);
    --err: #f85149;
    --err-soft: rgba(248, 81, 73, .12);
    --jf: #8b74ff;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 28px 22px 56px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 18px; flex-wrap: wrap; margin-bottom: 24px;
  }
  .brand { display: flex; align-items: center; gap: 13px; }
  .mark {
    width: 38px; height: 38px; border-radius: 11px; flex: none;
    background: linear-gradient(140deg, #4c8dff, #7b5cff);
    display: grid; place-items: center;
    box-shadow: 0 4px 18px rgba(76, 141, 255, .3);
  }
  .mark svg { width: 21px; height: 21px; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .2px; }
  .sub { color: var(--dim); font-size: 12.5px; margin-top: 1px; }
  .actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

  button {
    font: inherit; font-size: 13px; font-weight: 500;
    padding: 8px 15px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); transition: .16s ease; white-space: nowrap;
  }
  button:hover:not(:disabled) { border-color: #35415a; background: #1f2637; }
  button:disabled { opacity: .38; cursor: not-allowed; }
  button.primary {
    background: var(--accent); border-color: transparent; color: #fff;
    box-shadow: 0 2px 12px rgba(76, 141, 255, .28);
  }
  button.primary:hover:not(:disabled) { background: #3f7deb; }
  button.danger { color: var(--err); border-color: rgba(248, 81, 73, .35); }
  button.danger:hover:not(:disabled) { background: var(--err-soft); }
  button.tiny { padding: 5px 11px; font-size: 12px; border-radius: 8px; }

  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
  .badge.scanning { color: var(--accent); border-color: rgba(76, 141, 255, .3); background: var(--accent-soft); }
  .badge.scanning .dot { background: var(--accent); }
  .badge.running { color: var(--ok); border-color: rgba(63, 185, 80, .3); background: var(--ok-soft); }
  .badge.running .dot { background: var(--ok); }
  .badge.stopping { color: var(--warn); border-color: rgba(210, 153, 34, .3); }
  .badge.stopping .dot { background: var(--warn); }
  .badge.scanning .dot, .badge.running .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }

  .stats {
    display: grid; gap: 12px; margin-bottom: 16px;
    grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
  }
  .card {
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 15px 17px; position: relative; overflow: hidden;
  }
  .card::after {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
    background: var(--accent); opacity: .5;
  }
  .card.ok::after { background: var(--ok); }
  .card.err::after { background: var(--err); }
  .card.warn::after { background: var(--warn); }
  .card .label { color: var(--muted); font-size: 12px; letter-spacing: .3px; }
  .card .value {
    font-size: 25px; font-weight: 650; margin-top: 5px; letter-spacing: -.5px;
    font-variant-numeric: tabular-nums;
  }
  .card.ok .value { color: var(--ok); }
  .card.err .value { color: var(--err); }
  .card.warn .value { color: var(--warn); }

  .progress-wrap {
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 15px 18px; margin-bottom: 16px;
  }
  .progress-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12.5px; color: var(--muted); margin-bottom: 9px;
  }
  .progress-head b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 7px; border-radius: 999px; background: #1b2233; overflow: hidden; }
  .bar span {
    display: block; height: 100%; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), #7b5cff);
    transition: width .5s cubic-bezier(.4, 0, .2, 1);
  }

  .grid { display: grid; gap: 16px; grid-template-columns: 1fr 1.15fr; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } body { padding: 20px 14px 46px; } }

  .panel {
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column;
    margin-bottom: 16px;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 17px; border-bottom: 1px solid var(--border-soft); flex: none;
    flex-wrap: wrap;
  }
  .panel-head h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .2px; }
  .panel-head .hint { color: var(--dim); font-size: 12px; }
  .panel-head .head-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .panel-body { padding: 6px 9px 9px; overflow-y: auto; max-height: 340px; }
  .panel-body::-webkit-scrollbar { width: 8px; }
  .panel-body::-webkit-scrollbar-thumb { background: #2a3346; border-radius: 99px; }
  .panel-body::-webkit-scrollbar-track { background: transparent; }

  /* ---------- 媒体服务器 ---------- */
  .servers { display: grid; gap: 10px; padding: 12px 14px 14px;
             grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .server {
    border: 1px solid var(--border); border-radius: 11px; padding: 11px 13px;
    background: var(--surface-2); position: relative;
  }
  .server::before {
    content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px;
    border-radius: 99px; background: var(--jf); opacity: .85;
  }
  .server.emby::before { background: var(--ok); }
  .server.off { opacity: .55; }
  .server .s-top { display: flex; align-items: center; gap: 8px; }
  .kind {
    font-size: 10.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
    padding: 2px 7px; border-radius: 6px; background: rgba(139, 116, 255, .16); color: #b3a4ff;
  }
  .server.emby .kind { background: rgba(63, 185, 80, .14); color: #7fd68d; }
  .server .s-name { font-size: 12.5px; font-weight: 600; }
  .server .s-state {
    margin-left: auto; font-size: 11.5px; display: inline-flex; align-items: center; gap: 5px;
    color: var(--ok);
  }
  .server .s-state.bad { color: var(--err); }
  .server .s-meta { color: var(--muted); font-size: 11.5px; margin-top: 5px;
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .server .s-url { color: var(--dim); font-size: 11px; margin-top: 2px;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .server .s-err { color: #ffb4b0; font-size: 11px; margin-top: 5px; line-height: 1.45; }

  .row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px; border-radius: 9px; transition: background .15s;
  }
  .row:hover { background: var(--surface-2); }
  .row .txt { min-width: 0; flex: 1; }
  .row .name { font-size: 12.5px; color: var(--text); overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .row .why { font-size: 11.5px; color: var(--err); margin-top: 2px; line-height: 1.45; }
  .row .why.mute { color: var(--dim); }
  .row .chips { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
  .chip { font-size: 10.5px; padding: 1px 6px; border-radius: 5px;
          border: 1px solid var(--border); color: var(--dim); }
  .chip.on { color: var(--ok); border-color: rgba(63, 185, 80, .3); }
  .row button { padding: 3px 9px; font-size: 11.5px; border-radius: 7px; flex: none; }
  .empty { padding: 24px 12px; text-align: center; color: var(--dim); font-size: 12.5px; }

  /* ---------- 日志 ---------- */
  .log-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input[type="search"] {
    font: inherit; font-size: 12.5px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    outline: none;
  }
  select:focus, input[type="search"]:focus { border-color: #35415a; }
  input[type="search"] { width: 190px; }
  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
            color: var(--muted); cursor: pointer; user-select: none; }
  .switch input { accent-color: var(--accent); }
  .log-body {
    padding: 10px 14px 14px; max-height: 300px; overflow-y: auto;
    font-family: "SF Mono", "Cascadia Mono", Consolas, monospace; font-size: 11.8px;
    line-height: 1.75;
  }
  .log-body::-webkit-scrollbar { width: 8px; }
  .log-body::-webkit-scrollbar-thumb { background: #2a3346; border-radius: 99px; }
  .log-line { display: flex; gap: 8px; }
  .log-line .t { color: var(--dim); flex: none; font-variant-numeric: tabular-nums; }
  .log-line .lv { flex: none; width: 42px; font-size: 10.5px; color: var(--dim); }
  .log-line .src { flex: none; width: 96px; color: #4f5c73; overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap; }
  .log-line .m { color: var(--muted); word-break: break-word; flex: 1; }
  .log-line.info .m { color: #9fb0c8; }
  .log-line.warn .m, .log-line.warn .lv { color: var(--warn); }
  .log-line.err .m, .log-line.err .lv { color: var(--err); }
  .log-line.dim .m { color: var(--dim); }
  .log-foot {
    padding: 8px 16px 10px; border-top: 1px solid var(--border-soft);
    color: var(--dim); font-size: 11.5px; display: flex; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .log-foot code { font-family: "SF Mono", Consolas, monospace; color: var(--muted); }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: 10px; font-size: 13px;
    box-shadow: 0 10px 32px rgba(0, 0, 0, .45);
    opacity: 0; pointer-events: none; transition: .25s ease; z-index: 99;
    max-width: min(680px, 90vw);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { border-color: rgba(248, 81, 73, .45); color: #ffb4b0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2.5"></rect>
          <path d="M3 14l4.5-4.5L12 14l3-3 6 6"></path>
          <circle cx="8.5" cy="8.5" r="1.2" fill="#fff" stroke="none"></circle>
        </svg>
      </div>
      <div>
        <h1>strm 刮削器</h1>
        <div class="sub" id="rootInfo">正在连接…</div>
      </div>
    </div>
    <div class="actions">
      <span class="badge" id="badge"><i class="dot"></i><span id="badgeText">空闲</span></span>
      <button id="btnInc" class="primary">增量刮削</button>
      <button id="btnFull">全量重刮</button>
      <button id="btnStop" class="danger" disabled>停止</button>
    </div>
  </header>

  <section class="stats">
    <div class="card"><div class="label">总文件</div><div class="value" id="sTotal">0</div></div>
    <div class="card ok"><div class="label">已完成</div><div class="value" id="sOk">0</div></div>
    <div class="card err"><div class="label">失败</div><div class="value" id="sFail">0</div></div>
    <div class="card warn"><div class="label">待处理</div><div class="value" id="sPending">0</div></div>
    <div class="card"><div class="label">进行中</div><div class="value" id="sActive">0</div></div>
  </section>

  <div class="progress-wrap">
    <div class="progress-head">
      <span>本轮进度 <b id="pText">—</b></span>
      <span id="pMeta">等待开始</span>
    </div>
    <div class="bar"><span id="pBar"></span></div>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2>媒体服务器</h2>
      <div class="head-tools">
        <span class="hint" id="imgHint">—</span>
        <button class="tiny" id="btnSrvTest">测试连接</button>
        <button class="tiny" id="btnSrvScan">扫描媒体库</button>
        <button class="tiny" id="btnSrvRefresh">补齐缺图</button>
      </div>
    </div>
    <div class="servers" id="serverList">
      <div class="empty" style="grid-column:1/-1">未配置媒体服务器</div>
    </div>
  </section>

  <div class="grid">
    <section class="panel">
      <div class="panel-head">
        <h2>正在处理</h2>
        <span class="hint" id="activeHint">—</span>
      </div>
      <div class="panel-body" id="activeList">
        <div class="empty">暂无进行中的任务</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>失败项</h2>
        <div class="head-tools">
          <span class="hint" id="failHint">—</span>
          <button class="tiny" id="btnRetry">重试全部</button>
        </div>
      </div>
      <div class="panel-body" id="failList">
        <div class="empty">暂无失败记录</div>
      </div>
    </section>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2>运行日志</h2>
      <div class="log-tools">
        <select id="logLevel">
          <option value="DEBUG">全部级别</option>
          <option value="INFO" selected>INFO 及以上</option>
          <option value="WARNING">警告及以上</option>
          <option value="ERROR">仅错误</option>
        </select>
        <input type="search" id="logSearch" placeholder="筛选关键字 / 文件名">
        <label class="switch"><input type="checkbox" id="logAuto" checked> 跟随最新</label>
        <button class="tiny" id="btnLogFile">原始日志</button>
        <button class="tiny" id="btnLogDownload">下载日志</button>
        <button class="tiny" id="btnLogErrors">下载错误日志</button>
      </div>
    </div>
    <div class="log-body" id="logBody">
      <div class="empty">等待日志…</div>
    </div>
    <div class="log-foot">
      <span>日志文件：<code id="logPath">—</code></span>
      <span>排查问题先看这里，或运行 <code>python -m scraper.main --doctor</code> 自检</span>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let failCache = '';
let srvCache = '';
let logSince = 0;
let logFilter = '';
let logMode = 'live';

function toast(msg, isErr) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast', 3200);
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = j.detail || j.message || detail; } catch (e) {}
    throw new Error(detail);
  }
  return res.json();
}

function fmtTime(sec) {
  if (!sec || sec < 1) return '0 秒';
  const s = Math.floor(sec % 60), m = Math.floor(sec / 60) % 60, h = Math.floor(sec / 3600);
  if (h) return `${h} 小时 ${m} 分`;
  if (m) return `${m} 分 ${s} 秒`;
  return `${s} 秒`;
}

function fmtBytes(n) {
  if (!n) return '';
  if (n >= 1048576) return (n / 1048576).toFixed(1) + 'MB';
  return Math.round(n / 1024) + 'KB';
}

const STATE_TEXT = { idle: '空闲', scanning: '扫描中', running: '刮削中', stopping: '正在停止' };

async function refresh() {
  let st;
  try {
    st = await api('/api/status');
  } catch (e) {
    $('badgeText').textContent = '连接失败';
    $('badge').className = 'badge stopping';
    return;
  }

  const stats = st.stats || {};
  $('sTotal').textContent = stats.total ?? 0;
  $('sOk').textContent = (stats.ok ?? 0) + (stats.skipped ?? 0);
  $('sFail').textContent = stats.failed ?? 0;
  $('sPending').textContent = stats.pending ?? 0;
  $('sActive').textContent = (st.active || []).length;

  const busy = ['scanning', 'running', 'stopping'].includes(st.state);
  $('badge').className = 'badge ' + st.state;
  $('badgeText').textContent = STATE_TEXT[st.state] || st.state;
  $('btnInc').disabled = busy;
  $('btnFull').disabled = busy;
  $('btnRetry').disabled = busy;
  $('btnStop').disabled = !busy;

  $('rootInfo').textContent = (st.roots || []).join('  ·  ') || '未配置扫描目录';
  $('activeHint').textContent = busy
    ? `${(st.active || []).length} / ${st.concurrency} 并发`
    : '—';

  const imgs = st.images || {};
  if (imgs.poster) {
    $('imgHint').textContent =
      `海报 ${imgs.poster[0]}×${imgs.poster[1]}（2:3） · 背景 ${imgs.fanart[0]}×${imgs.fanart[1]}（16:9）`;
  }
  if (st.log_file) $('logPath').textContent = st.log_file;

  const done = st.processed || 0;
  const remain = stats.pending ?? 0;
  const total = done + remain;
  const pct = busy && total > 0 ? Math.min(100, Math.round(done / total * 100))
             : (!busy && done > 0 ? 100 : 0);
  $('pBar').style.width = pct + '%';
  $('pText').textContent = total > 0 ? `${done} / ${total}` : '—';

  const ref = st.refresh || {};
  $('pMeta').textContent = busy
    ? `成功 ${st.succeeded} · 失败 ${st.failed} · 已用 ${fmtTime(st.elapsed)}`
    : (ref.running ? `补图中：${ref.message}`
       : (st.mode ? `上轮${st.mode === 'full' ? '全量' : '增量'}已结束` : '等待开始'));
  if (!busy && st.last_error) $('pMeta').textContent = '异常：' + st.last_error;

  renderServers(st.servers || []);
  renderActive(st.active || []);
  renderFails(stats.failed ?? 0, st.state);
  if (logMode === 'live') await pollLogs();
}

function renderServers(list) {
  const box = $('serverList');
  if (!list.length) {
    box.innerHTML = '<div class="empty" style="grid-column:1/-1">未配置媒体服务器，'
      + '在 config.yaml 的 servers 段添加 Emby 或 Jellyfin 即可</div>';
    return;
  }
  const html = list.map(s => {
    const kind = (s.type || 'jellyfin').toLowerCase();
    const cls = kind === 'emby' ? 'emby' : '';
    return `<div class="server ${cls}${s.ok ? '' : ' off'}">
      <div class="s-top">
        <span class="kind">${esc(kind)}</span>
        <span class="s-name">${esc(s.name)}</span>
        <span class="s-state ${s.ok ? '' : 'bad'}">
          <i class="dot" style="background:${s.ok ? 'var(--ok)' : 'var(--err)'}"></i>
          ${s.ok ? esc(s.version || '在线') : '离线'}
        </span>
      </div>
      <div class="s-meta">${s.ok ? '连接正常' : '连接失败'}${s.refresh_after ? ' · 自动刷新' : ' · 仅生成文件'}</div>
      <div class="s-url" title="${esc(s.url)}">${esc(s.url)}</div>
      ${s.ok ? '' : `<div class="s-err">${esc(s.detail || '无法连接')}</div>`}
    </div>`;
  }).join('');
  if (html === srvCache) return;
  srvCache = html;
  box.innerHTML = html;
}

function renderActive(active) {
  const box = $('activeList');
  if (!active.length) {
    box.innerHTML = '<div class="empty">暂无进行中的任务</div>';
    return;
  }
  box.innerHTML = active.map(p => {
    const name = p.split(/[\\/]/).pop();
    return `<div class="row"><div class="txt"><div class="name">${esc(name)}</div>
      <div class="why mute">${esc(dirOf(p))}</div></div></div>`;
  }).join('');
}

async function renderFails(count, state) {
  const box = $('failList');
  $('failHint').textContent = count > 0 ? `${count} 条待处理` : '—';
  const key = `${count}|${state}`;
  if (key === failCache) return;
  failCache = key;

  if (!count) {
    box.innerHTML = '<div class="empty">暂无失败记录</div>';
    return;
  }
  let data;
  try { data = await api('/api/items?status=failed&size=60'); } catch (e) { return; }
  if (!data.items.length) {
    box.innerHTML = '<div class="empty">暂无失败记录</div>';
    return;
  }
  box.innerHTML = data.items.map(it => `
    <div class="row">
      <div class="txt">
        <div class="name" title="${esc(it.path)}">${esc(it.name)}</div>
        <div class="why">${esc(it.reason || '未知原因')}</div>
      </div>
      <button data-path="${esc(it.path)}" class="redo">重刮</button>
    </div>`).join('');

  box.querySelectorAll('button.redo').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const r = await api('/api/redo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: btn.dataset.path })
        });
        toast(r.message || '已加入队列');
        failCache = '';
      } catch (e) {
        toast(e.message, true);
        btn.disabled = false;
      }
    });
  });
}

function logLine(l) {
  return `<div class="log-line ${l.level_style}" title="${esc(l.item || '')}">
    <span class="t">${l.time}</span>
    <span class="lv">${l.level.slice(0, 4)}</span>
    <span class="src">${esc(l.name || '')}</span>
    <span class="m">${esc(l.message)}</span></div>`;
}

async function pollLogs() {
  const level = $('logLevel').value;
  const q = $('logSearch').value.trim();
  const key = level + '|' + q;
  const body = $('logBody');
  if (key !== logFilter) {
    logFilter = key;
    logSince = 0;
    body.innerHTML = '';
  }
  let data;
  try {
    data = await api(`/api/logs?limit=400&level=${encodeURIComponent(level)}`
      + `&q=${encodeURIComponent(q)}&since=${logSince}`);
  } catch (e) { return; }

  if (data.logs.length) {
    const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 60;
    const html = data.logs.map(logLine).join('');
    body.insertAdjacentHTML('beforeend', html);
    logSince = data.last_id;
    // 只保留最近 600 行，避免越积越卡
    while (body.childElementCount > 600) body.removeChild(body.firstElementChild);
    if (atBottom || $('logAuto').checked) body.scrollTop = body.scrollHeight;
  } else if (!body.childElementCount) {
    body.innerHTML = '<div class="empty">没有匹配的日志</div>';
  }
}

async function showRawLog() {
  try {
    const data = await api('/api/logs/file?limit=400');
    const body = $('logBody');
    if (!data.lines || !data.lines.length) {
      toast('日志文件还没内容', true);
      return;
    }
    logMode = 'file';
    $('btnLogFile').textContent = '回到实时';
    body.innerHTML = data.lines.map(line =>
      `<div class="log-line dim"><span class="m">${esc(line)}</span></div>`).join('');
    body.scrollTop = body.scrollHeight;
  } catch (e) { toast(e.message, true); }
}

function backToLive() {
  logMode = 'live';
  logSince = 0;
  logFilter = '';
  $('btnLogFile').textContent = '原始日志';
  $('logBody').innerHTML = '';
  pollLogs();
}

function dirOf(p) {
  const parts = p.split(/[\\/]/);
  parts.pop();
  return parts.slice(-2).join('/');
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function trigger(kind) {
  const isFull = kind === 'full';
  if (isFull && !confirm('全量重刮会覆盖所有已生成的海报和 NFO，确定继续？')) return;
  $('btnInc').disabled = $('btnFull').disabled = true;
  try {
    const r = await api('/api/scan?full=' + (isFull ? 'true' : 'false'), { method: 'POST' });
    toast(r.message || '已开始');
    failCache = '';
    setTimeout(refresh, 400);
  } catch (e) {
    toast(e.message, true);
    refresh();
  }
}

$('btnInc').addEventListener('click', () => trigger('inc'));
$('btnFull').addEventListener('click', () => trigger('full'));
$('btnStop').addEventListener('click', async () => {
  try {
    const r = await api('/api/stop', { method: 'POST' });
    toast(r.message || '已发送停止请求');
  } catch (e) { toast(e.message, true); }
});
$('btnRetry').addEventListener('click', async () => {
  try {
    const r = await api('/api/retry-failed', { method: 'POST' });
    toast(r.message || '已重置');
    failCache = '';
    refresh();
  } catch (e) { toast(e.message, true); }
});
$('btnSrvTest').addEventListener('click', async () => {
  const btn = $('btnSrvTest');
  btn.disabled = true;
  try {
    const r = await api('/api/servers/test', { method: 'POST' });
    const detail = (r.servers || []).map(s => `${s.name}: ${s.detail || s.version || '未知'}`);
    toast([r.message, ...detail].join(' · '), !r.ok);
    srvCache = '';
    refresh();
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; }
});
$('btnSrvScan').addEventListener('click', async () => {
  try {
    const r = await api('/api/servers/scan', { method: 'POST' });
    toast(r.message);
  } catch (e) { toast(e.message, true); }
});
$('btnSrvRefresh').addEventListener('click', async () => {
  if (!confirm('把这些文件的图片交给媒体服务器重建？Emby 一般能自动读，Jellyfin 需要这一步。')) return;
  try {
    const r = await api('/api/servers/refresh', { method: 'POST' });
    toast(r.message);
    setTimeout(refresh, 600);
  } catch (e) { toast(e.message, true); }
});
$('btnLogFile').addEventListener('click', () => {
  if (logMode === 'live') showRawLog(); else backToLive();
});
$('btnLogDownload').addEventListener('click', () => {
  window.open('/api/logs/download?which=main', '_blank');
});
$('btnLogErrors').addEventListener('click', () => {
  window.open('/api/logs/download?which=errors', '_blank');
});
$('logSearch').addEventListener('input', () => { logFilter = ''; });
$('logLevel').addEventListener('change', () => { logFilter = ''; });

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
