<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234c8dff'/%3E%3Crect x='7' y='9' width='18' height='14' rx='2.5' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='12' cy='14' r='1.5' fill='white'/%3E%3Cpath d='M7 21l5-5 3.5 3.5L19 16l6 6' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<title>登录 · strm 刮削器</title>
<style>
  :root {
    --bg: #0b0e14;
    --surface: #131722;
    --surface-2: #1a2030;
    --border: #232b3d;
    --border-soft: #1c2333;
    --text: #e6edf3;
    --muted: #8b98ad;
    --dim: #5d6a80;
    --accent: #4c8dff;
    --accent-soft: rgba(76, 141, 255, .12);
    --err: #f85149;
    --err-soft: rgba(248, 81, 73, .12);
    --warn: #d29922;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background:
      radial-gradient(1000px 520px at 50% -10%, rgba(76, 141, 255, .16), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 376px;
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 32px 30px 26px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, .5);
  }
  .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 26px; }
  .mark {
    width: 42px; height: 42px; border-radius: 12px; flex: none;
    background: linear-gradient(140deg, #4c8dff, #7b5cff);
    display: grid; place-items: center;
    box-shadow: 0 6px 20px rgba(76, 141, 255, .34);
  }
  .mark svg { width: 23px; height: 23px; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .2px; }
  .sub { color: var(--dim); font-size: 12.5px; margin-top: 2px; }

  label { display: block; font-size: 12.5px; color: var(--muted); margin: 0 0 6px; }
  .field { margin-bottom: 15px; }
  input {
    font: inherit; font-size: 14px; width: 100%;
    padding: 10px 13px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    outline: none; transition: border-color .16s, box-shadow .16s;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input::placeholder { color: var(--dim); }

  button {
    font: inherit; font-size: 14px; font-weight: 550; width: 100%;
    padding: 11px 16px; border-radius: 10px; cursor: pointer;
    border: 1px solid transparent; background: var(--accent); color: #fff;
    box-shadow: 0 3px 16px rgba(76, 141, 255, .3);
    transition: .16s ease; margin-top: 6px;
  }
  button:hover:not(:disabled) { background: #3f7deb; }
  button:disabled { opacity: .55; cursor: not-allowed; }

  .msg {
    display: none; font-size: 12.5px; line-height: 1.5;
    padding: 9px 12px; border-radius: 9px; margin-bottom: 15px;
  }
  .msg.show { display: block; }
  .msg.err { background: var(--err-soft); border: 1px solid rgba(248, 81, 73, .35); color: #ffb4b0; }
  .msg.warn { background: rgba(210, 153, 34, .12); border: 1px solid rgba(210, 153, 34, .35); color: #e5c07b; }

  .foot {
    margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-soft);
    color: var(--dim); font-size: 11.5px; line-height: 1.7;
  }
  .foot code { font-family: "SF Mono", Consolas, monospace; color: var(--muted); }
</style>
</head>
<body>
<form class="card" id="form" autocomplete="on">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2.5"></rect>
        <path d="M3 14l4.5-4.5L12 14l3-3 6 6"></path>
        <circle cx="8.5" cy="8.5" r="1.2" fill="#fff" stroke="none"></circle>
      </svg>
    </div>
    <div>
      <h1>strm 刮削器</h1>
      <div class="sub">登录后管理刮削任务</div>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="field">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username"
           autocapitalize="off" spellcheck="false" required>
  </div>
  <div class="field">
    <label for="password">密码</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>
  </div>

  <button type="submit" id="btn">登 录</button>

  <div class="foot">
    忘记密码：删除 <code>config/auth.json</code>，重启容器后恢复为 <code>admin</code> / <code>admin</code>。
  </div>
</form>

<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let next = params.get('next') || '/';
// 只允许站内跳转，挡掉 //evil.com 这类开放重定向
if (!next.startsWith('/') || next.startsWith('//')) next = '/';

function showMsg(text, kind) {
  const el = $('msg');
  el.textContent = text;
  el.className = 'msg show ' + (kind || 'err');
}

async function boot() {
  try {
    const res = await fetch('/api/auth-info');
    const info = await res.json();
    if (!info.enabled) { location.replace('/'); return; }
    if (info.logged_in) { location.replace(next); return; }
    if (info.default_password) {
      showMsg('还在用默认密码 admin，登录后请立刻修改', 'warn');
    }
    $('username').value = info.default_password ? 'admin' : '';
    ($('username').value ? $('password') : $('username')).focus();
  } catch (e) {
    showMsg('无法连接服务，检查容器是否在运行', 'err');
  }
}

$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = $('btn');
  const username = $('username').value.trim();
  const password = $('password').value;
  if (!username || !password) { showMsg('请输入用户名和密码'); return; }

  btn.disabled = true;
  btn.textContent = '登录中…';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      showMsg(data.detail || data.message || '登录失败', 'err');
      $('password').select();
      return;
    }
    location.replace(next);
  } catch (e) {
    showMsg('网络异常，请重试', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
});

boot();
</script>
</body>
</html>
