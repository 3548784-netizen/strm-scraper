# strm 刮削器配置
# 改完重启容器生效。环境变量优先级更高，例如 WS_SCAN__CONCURRENCY=4。
# servers 是列表，多台服务器建议直接写在这里，环境变量不好表达列表。

scan:
  # 要扫描的目录（容器内路径）。多个目录写多行。
  roots:
    - /media

  # 是否递归扫描子目录
  recursive: true

  # 处理的文件类型。默认全开：支持的格式放进媒体库就直接刮，不用改这里。
  # 只有想加冷门容器（.iso / .vob 之类）时才需要往下面补一条。
  # 想反过来**限制**成只刮 strm，就把列表删到只剩 .strm。
  extensions:
    - .strm
    - .mp4
    - .m4v
    - .mkv
    - .avi
    - .ts
    - .m2ts
    - .mov
    - .wmv
    - .flv
    - .rmvb
    - .webm
    - .mpg

  # auto        首次运行全量刮一遍，之后只补缺失
  # full        每次运行都全量重刮，会覆盖已有海报和 NFO
  # incremental 只处理缺失的，从不主动重刮已有的
  # manual      不自动运行，只在网页上手动点「开始任务」（默认）
  mode: manual

  # 容器启动后是否自动开跑。默认 false —— 打开网页点「开始任务」才开始，
  # 免得一启动就在后台跑满带宽。想开机就刮就改成 true（mode 不能是 manual）。
  autostart: false

  # 定时扫描间隔（分钟）。0 表示不定时，只在网页手动触发。
  interval_minutes: 0

  # 并发处理数。网盘源按「瞬时并发」限流，3 比较稳；调到 5 以上容易撞 503/504。
  concurrency: 3

  # 单个时间点抓一帧的超时（秒）。超过 30 秒基本是被限流或链接废了，
  # 再等只会拖住整个队列，不如放掉重排到后面。
  timeout: 30

  # 探测阶段网络超时（秒）。strm 指向的地址失效时，靠这个快速失败。
  probe_timeout: 8

scrape:
  # 采样帧数。从 frame_positions 里按比例均匀取这么多点（不是取前 N 个），
  # 所以 2 就是列表两端的 0.15 和 0.75。每多一帧就多一次网络抓帧，
  # 5 帧比 2 帧慢一倍以上，而多出来的帧选中的概率并不高。
  # 网页上手动选过帧的文件不参与采样，直接用你选的那一秒。
  frames: 2

  # 采样位置，按片长比例。避开片头片尾，中间密集一些。
  frame_positions:
    - 0.15
    - 0.30
    - 0.45
    - 0.60
    - 0.75

  # 分辨率小于这个值的帧视为无效
  min_width: 320

  # 竖版海报。Emby 和 Jellyfin 都要求 2:3，推荐 1000×1500，最小 500×750。
  # 比例写错会自动校正并在日志里告警（写 500×800 会变成 500×750）。
  poster:
    width: 1000
    height: 1500
    # crop      中心裁切铺满 2:3（默认）。横版视频也整张海报铺满，没有背景条
    # blur      模糊背景铺满 + 画面完整居中，横版视频上下会留两条背景，主体不丢
    # gradient  背景用画面上下边缘的平均色做渐变，最干净、无残影
    mode: crop

  # 横版背景图（fanart / backdrop）。两家都推荐 16:9，1920×1080。
  fanart:
    width: 1920
    height: 1080

  # 16:9 缩略图，写 <名称>-thumb.jpg。Emby 的列表视图会用；默认开启。
  thumb:
    enabled: true
    width: 1000
    height: 562

  # 分别控制是否生成各类产物
  write_nfo: true
  write_poster: true
  write_fanart: true

  # missing  只在文件缺失时生成（推荐，不会覆盖你手动改过的内容）
  # always   每次都覆盖
  overwrite: missing

  jpeg_quality: 92

# ---------------------------------------------------------------------------
# 115 网盘直链：连接台账 + 请求节奏
# strm 里写的是一条带签名的播放直链。刮一个 strm 至少要连网盘 3 次
# （ffprobe 1 次 + 抓 2 帧），批量任务一涌进来最容易触发风控。
# 完整行为约定与验证要点见 docs/115-links.md。
# 网页「设置 → 115 连接与节奏」也能改，保存后立即生效，不用重启。
links:
  enabled: true

  # --- 节奏：全进程共用一份额度（批量队列 / 网页选帧 / 单条刮削都算） ---
  # 同时发往网盘的请求上限。115 按瞬时连接数掐人，2 路比较稳
  max_inflight: 2
  # 同一个域名 / 转直链服务同时几路
  per_host_inflight: 2
  # 令牌桶：每分钟最多发起多少次新请求，burst 是允许的瞬时突发额度
  rate_per_minute: 60
  burst: 2
  # 两次发起请求之间的最小间隔（毫秒）
  min_gap_ms: 300
  # 排队等槽位的上限。超出的任务原样退回持久队列，不算失败、不发请求
  queue_max: 2000
  # 单个请求最多排队多久（秒），超时退回队列稍后重排
  acquire_timeout: 180
  # 本机 / 测试媒体服务不占网盘额度（按 host 匹配，不带端口）
  bypass_hosts: [127.0.0.1, localhost, ::1]

  # --- 撞到 403 / 429 / 5xx 之后 ---
  # 自动降到单路并保持冷却这么久，连续成功 recover_every 次才回升一档
  cooldown_seconds: 60
  degrade_gap_ms: 800
  recover_every: 8

  # --- 直链台账 ---
  # 直链缓存多久算「可能过期」。过期只标记 stale，仍然继续复用，
  # 绝不因为批量任务开始就集体重新校验（那才是最容易撞风控的动作）
  link_ttl_minutes: 360
  # true = 粘住已有连接：重启、过期、任务删除都不会让它失效
  sticky: true
  # 可选：直链失效时调一次刷新钩子拿新地址。留空表示以 strm 文件为准。
  # 支持 {path} / {url} 占位；返回 {"url":"https://..."} 或一行纯 URL。
  refresh_url: ""
  refresh_token: ""
  refresh_on_error: true
  # 每分钟最多发多少次刷新请求，防止一批失效链接同时刷新
  verify_budget_per_minute: 6

  # --- 批量任务 ---
  # 单轮在途任务上限（与 scan.concurrency 取小），以及两次派发的最小间隔。
  # 在途上限每轮开始时读取一次：跑动中改这个值，下一轮任务才生效。
  batch_size: 20
  batch_interval_ms: 0

  # --- 失败恢复 ---
  # 指数退避 + 抖动：同一批任务不会在同一秒一起醒来重试
  retry_base_seconds: 30
  retry_max_seconds: 1800
  retry_jitter: 0.30
  retry_max_attempts: 5

# Emby 和 Jellyfin 都支持，可以同时配多台，刮完会分别刷新。
# 不配也能用，只是生成完文件后要自己在服务器上点一次刷新。
servers:
  # ---------- Jellyfin ----------
  # - name: jellyfin          # 网页上显示的名字，随便起
  #   type: jellyfin          # jellyfin / emby / auto（auto 自动识别）
  #   enabled: false
  #   url: http://192.168.1.10:8096
  #   api_key: ""             # 控制台 → API 密钥 → 新建
  #   timeout: 30
  #   refresh_after: true     # 刮完自动让它重建图片缓存
  #   verify_after: true      # 刷新后回查一遍，确认图真的被识别
  #   scan_after: false       # 刮完顺手触发一次媒体库扫描
  #   insecure: false         # 自签名 https 证书时设为 true
  #   path_map:
  #     # 容器内路径: 服务端看到的路径
  #     # 两边挂载不一样时必须配，否则按路径匹配不到条目
  #     /media: /vol1/1000/LitePan/strm

  # ---------- Emby ----------
  # - name: emby
  #   type: emby
  #   enabled: false
  #   url: http://192.168.1.10:8096
  #   api_key: ""
  #   path_map:
  #     /media: /vol1/1000/LitePan/strm

web:
  enabled: true
  host: 0.0.0.0
  port: 6666
  auth:
    # 登录后才能操作控制台。首次启动会创建 admin / admin，登录后可在网页上改
    enabled: true
    # 登录状态保持多少小时，默认 7 天
    session_hours: 168
    # 账号文件，密码是加盐哈希；删掉这个文件后重启会重置成 admin / admin
    file: /config/auth.json
    # 只有跑在反向代理（Nginx / Traefik / Caddy 等）后面才设成 true。
    # 否则登录限流会把代理的 IP 当成所有访客的来源：要么一个人被锁、全站跟着
    # 被锁，要么谁也锁不住。直连访问请保持 false —— 此时 X-Forwarded-For /
    # X-Real-IP 一律不采信，客户端无法用伪造头绕过限流。
    # 开启后只取 XFF 的**最后一跳**（代理自己追加的那段），不看第一段。
    trust_proxy: false

storage:
  # 状态库位置，容器内路径，务必落在持久化卷上
  state_db: /config/state.db

log:
  # DEBUG 会打印每次抓帧、每个请求，排查问题时很有用；平时 INFO 就够
  level: INFO
  # 日志目录，留空则只输出到控制台
  dir: /config/logs
  file: strm-scraper.log
  # 单个文件上限（MB）与保留份数：超过就滚动，不会无限涨
  max_mb: 5
  backups: 5
  # 同时输出到容器标准输出，docker logs 里也能看
  console: true
