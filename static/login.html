<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234c8dff'/%3E%3Crect x='7' y='9' width='18' height='14' rx='2.5' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='12' cy='14' r='1.5' fill='white'/%3E%3Cpath d='M7 21l5-5 3.5 3.5L19 16l6 6' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<title>登录 · strm-scraper</title>
<style>
  /* 与主界面共用同一套设计令牌，只保留登录页用得到的 */
  :root {
    --bg: #0a0d13;
    --bg-deep: #070a10;
    --surface: #11151e;
    --surface-2: #171d28;
    --line-soft: #1a212d;
    --line: #232c3b;
    --text: #e9eff8;
    --text-2: #aab6c8;
    --text-3: #7b8798;
    --text-4: #5c687b;
    --accent: #4c8dff;
    --accent-hover: #3f7deb;
    --accent-soft: rgba(76, 141, 255, .12);
    --err-soft: rgba(242, 88, 79, .12);
    --err-ink: #ff9f98;
    --warn-soft: rgba(217, 162, 39, .12);
    --warn-ink: #f0c674;
    --jf: #8b74ff;

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px;
    --r-xs: 6px; --r-sm: 8px; --r-md: 10px; --r-lg: 14px;
    --h-ctl: 40px;
    --sh-2: 0 8px 26px rgba(0, 0, 0, .38);
    --sh-3: 0 24px 64px rgba(0, 0, 0, .56);
    --ease: cubic-bezier(.4, 0, .2, 1);
    --dur: .16s;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background:
      radial-gradient(900px 480px at 50% -12%, rgba(76, 141, 255, .14), transparent 62%),
      var(--bg);
    color: var(--text);
    font: 13px/1.6 var(--font);
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; padding: var(--s6);
  }
  .card {
    width: 100%; max-width: 380px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: var(--s6) var(--s6) var(--s5);
    box-shadow: var(--sh-3);
  }
  .brand { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s6); }
  .mark {
    width: 42px; height: 42px; border-radius: var(--r-md); flex: none;
    background: linear-gradient(140deg, var(--accent), var(--jf));
    display: grid; place-items: center;
    box-shadow: 0 4px 18px rgba(76, 141, 255, .32);
  }
  .mark svg { width: 23px; height: 23px; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .1px; }
  .sub { color: var(--text-3); font-size: 12px; margin-top: 2px; }

  label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin: 0 0 6px; }
  .field { margin-bottom: var(--s4); }
  input {
    font: inherit; font-size: 14px; width: 100%; height: var(--h-ctl);
    padding: 0 var(--s3); border-radius: var(--r-sm);
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    outline: none;
    transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  input:hover { border-color: #33415a; }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input::placeholder { color: var(--text-4); }

  button {
    font: inherit; font-size: 14px; font-weight: 600; width: 100%;
    height: 42px; border-radius: var(--r-sm); cursor: pointer;
    border: 1px solid transparent; color: #fff;
    background: var(--accent);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .16) inset, 0 3px 14px rgba(76, 141, 255, .3);
    transition: background var(--dur) var(--ease), transform var(--dur) var(--ease),
                box-shadow var(--dur) var(--ease);
    margin-top: var(--s1); letter-spacing: .5px;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
  button:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-xs); }

  .msg {
    display: none; font-size: 12px; line-height: 1.55;
    padding: var(--s2) var(--s3); border-radius: var(--r-sm); margin-bottom: var(--s4);
  }
  .msg.show { display: block; }
  .msg.err { background: var(--err-soft); border: 1px solid rgba(242, 88, 79, .35); color: var(--err-ink); }
  .msg.warn { background: var(--warn-soft); border: 1px solid rgba(217, 162, 39, .35); color: var(--warn-ink); }

  .foot {
    margin-top: var(--s5); padding-top: var(--s4); border-top: 1px solid var(--line-soft);
    color: var(--text-3); font-size: 11.5px; line-height: 1.8;
  }
  .foot code {
    font-family: var(--font-mono); color: var(--text-2);
    background: var(--surface-2); padding: 1px 5px; border-radius: var(--r-xs);
  }
</style>
</head>
<body>
<form class="card" id="form" autocomplete="on">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2.5"></rect>
        <path d="M3 14l4.5-4.5L12 14l3-3 6 6"></path>
        <circle cx="8.5" cy="8.5" r="1.2" fill="#fff" stroke="none"></circle>
      </svg>
    </div>
    <div>
      <h1>strm-scraper</h1>
      <div class="sub">登录后管理刮削任务</div>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="field">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username"
           autocapitalize="off" spellcheck="false" required>
  </div>
  <div class="field">
    <label for="password">密码</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>
  </div>

  <button type="submit" id="btn">登 录</button>

  <div class="foot">
    忘记密码：删除 <code>config/auth.json</code>，重启容器后恢复为 <code>admin</code> / <code>admin</code>。
  </div>
</form>

<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let next = params.get('next') || '/';
// 只允许站内跳转，挡掉 //evil.com 这类开放重定向
if (!next.startsWith('/') || next.startsWith('//')) next = '/';

function showMsg(text, kind) {
  const el = $('msg');
  el.textContent = text;
  el.className = 'msg show ' + (kind || 'err');
}

async function boot() {
  try {
    const res = await fetch('/api/auth-info');
    const info = await res.json();
    if (!info.enabled) { location.replace('/'); return; }
    if (info.logged_in) { location.replace(next); return; }
    if (info.default_password) {
      showMsg('还在用默认密码 admin，登录后请立刻修改', 'warn');
    }
    $('username').value = info.default_password ? 'admin' : '';
    ($('username').value ? $('password') : $('username')).focus();
  } catch (e) {
    showMsg('无法连接服务，检查容器是否在运行', 'err');
  }
}

$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = $('btn');
  const username = $('username').value.trim();
  const password = $('password').value;
  if (!username || !password) { showMsg('请输入用户名和密码'); return; }

  btn.disabled = true;
  btn.textContent = '登录中…';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      showMsg(data.detail || data.message || '登录失败', 'err');
      $('password').select();
      return;
    }
    location.replace(next);
  } catch (e) {
    showMsg('网络异常，请重试', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
});

boot();
</script>
</body>
</html>
